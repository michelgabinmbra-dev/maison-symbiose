<!doctype html>
<html lang="fr">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--nuit:#0B1442;--nuit2:#142266;--fond:#F3F5FB;--texte:#0F1733;--gris:#5A6585;--bord:#E6E9F4;--bleu:#2563EB}
*{box-sizing:border-box}
html,body{margin:0;background:var(--fond);color:var(--texte);font-family:Inter,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{min-height:100vh}
h1,h2,h3,.titre{font-family:'Plus Jakarta Sans',Inter,sans-serif}
button,input,select,textarea{font-family:inherit;font-size:16px}
a{color:var(--bleu);text-decoration:none}
#app{max-width:520px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:100px}
.hero{position:relative;overflow:hidden;background:linear-gradient(160deg,#0B1442 0%,#142266 60%,#1B2C86 100%);padding:22px 20px 44px;color:#fff}
.hero.court{padding-bottom:36px}
.orb{position:absolute;border-radius:50%;pointer-events:none}
.orb.a{width:220px;height:220px;right:-70px;top:-80px;background:radial-gradient(circle,rgba(59,130,246,.75),rgba(59,130,246,0) 70%)}
.orb.b{width:200px;height:200px;left:-90px;bottom:-60px;background:radial-gradient(circle,rgba(236,72,153,.55),rgba(236,72,153,0) 70%)}
.hero>*:not(.orb),.entete>*:not(.orb),.connexion>*:not(.orb){position:relative}
.ligne{display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#3B82F6,#8B5CF6 45%,#EC4899 75%,#F59E0B);display:flex;align-items:center;justify-content:center;flex:none}
.surtitre{font-size:12px;color:#A9B6E8;letter-spacing:.04em;text-transform:uppercase}
.hero h1{margin:0;font-size:23px;font-weight:800}
.avatar{width:44px;height:44px;border-radius:22px;padding:2px;background:linear-gradient(135deg,#22D3EE,#A855F7,#F43F5E);border:none;flex:none}
.avatar span{display:flex;width:100%;height:100%;border-radius:20px;background:#142266;color:#fff;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.tuiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:18px}
.tuile{border-radius:18px;padding:14px;color:#fff;display:flex;flex-direction:column;gap:2px;border:none;text-align:left}
.tuile b{font-family:'Plus Jakarta Sans',Inter,sans-serif;font-size:30px;font-weight:800;line-height:1}
.tuile span{font-size:13px;font-weight:500}
.t1{background:linear-gradient(135deg,#2563EB,#1E40AF);box-shadow:0 10px 24px rgba(37,99,235,.35)}
.t2{background:linear-gradient(135deg,#EA580C,#BE123C);box-shadow:0 10px 24px rgba(225,29,72,.35)}
.t3{background:linear-gradient(135deg,#7C3AED,#BE185D);box-shadow:0 10px 24px rgba(124,58,237,.35)}
.t4{background:linear-gradient(135deg,#0F766E,#0E7490);box-shadow:0 10px 24px rgba(14,116,144,.35)}
.feuille{margin-top:-24px;position:relative;background:var(--fond);border-radius:26px 26px 0 0;padding:18px 16px 0;display:flex;flex-direction:column;gap:10px}
.bandeau{border-radius:16px;padding:12px 14px;background:linear-gradient(110deg,#0B1442,#3B2A9B 60%,#7C3AED);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 8px 20px rgba(59,42,155,.28);border:none;width:100%;text-align:left}
.bandeau small{display:block;font-size:12px;color:#D4D9FF;font-weight:400}
.bandeau strong{font-family:'Plus Jakarta Sans',Inter,sans-serif;font-size:15px}
.rond{width:36px;height:36px;border-radius:18px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;flex:none}
h2{margin:4px 2px 0;font-size:17px;font-weight:800}
.carte{background:#fff;border-radius:16px;padding:12px;box-shadow:0 4px 14px rgba(15,23,51,.07);display:flex;flex-direction:column;gap:8px}
.item{background:#fff;border-radius:16px;padding:12px;display:flex;gap:12px;align-items:center;box-shadow:0 4px 14px rgba(15,23,51,.07);border:none;width:100%;text-align:left;color:var(--texte)}
.item.pointille{border:1.5px dashed #A5B4FC;box-shadow:none}
.ico{width:44px;height:44px;flex:none;border-radius:14px;display:flex;align-items:center;justify-content:center}
.ico.bleu{background:linear-gradient(135deg,#38BDF8,#2563EB)}.ico.rouge{background:linear-gradient(135deg,#FB923C,#E11D48)}
.ico.jaune{background:linear-gradient(135deg,#FBBF24,#EA580C)}.ico.violet{background:linear-gradient(135deg,#A78BFA,#7C3AED)}
.ico.vert{background:linear-gradient(135deg,#34D399,#0F766E)}.ico.pale{background:#EEF2FF}
.txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.txt b{font-size:15px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.txt small{font-size:12px;color:var(--gris)}
.pastille{flex:none;font-size:11px;font-weight:700;padding:5px 9px;border-radius:999px;white-space:nowrap}
.p-elevee{color:#fff;background:linear-gradient(135deg,#F43F5E,#BE123C);animation:pulse 1.8s infinite}
.p-moyenne{color:#92400E;background:#FEF3C7}.p-faible{color:#065F46;background:#D1FAE5}.p-vide{color:#3730A3;background:#E0E7FF}
.p-ok{color:#065F46;background:#D1FAE5}.p-alerte{color:#9F1239;background:#FFE4E6}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}70%{box-shadow:0 0 0 8px rgba(244,63,94,0)}100%{box-shadow:0 0 0 0 rgba(244,63,94,0)}}
@media (prefers-reduced-motion:reduce){.p-elevee{animation:none}}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));width:calc(100% - 28px);max-width:492px;height:66px;border-radius:22px;background:var(--nuit);box-shadow:0 14px 30px rgba(11,20,66,.35);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:center;z-index:10}
nav button{background:none;border:none;color:#A9B6E8;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:500;height:60px;justify-content:center}
nav button.actif{color:#fff;font-weight:700}
nav .plus{width:54px;height:54px;margin:-26px auto 0;border-radius:27px;border:4px solid var(--fond);background:linear-gradient(135deg,#3B82F6,#8B5CF6 50%,#EC4899);box-shadow:0 10px 22px rgba(139,92,246,.45);color:#fff}
.entete{background:linear-gradient(160deg,#0B1442,#142266 60%,#1B2C86);color:#fff;padding:14px 18px 34px;position:relative;overflow:hidden}
.retour{background:none;border:none;color:#C7D2FE;display:flex;align-items:center;gap:4px;font-size:14px;font-weight:600;height:36px;padding:0}
.entete h1{margin:6px 0 2px;font-size:21px;font-weight:800}
.entete p{margin:0;color:#C7D2FE;font-size:13px}
label{font-size:13px;font-weight:600;color:#3E4A6B;display:block;margin-bottom:6px}
input,select,textarea{width:100%;min-height:48px;border-radius:12px;border:1px solid #C9D0E3;padding:0 14px;background:#fff;color:var(--texte)}
textarea{padding:12px 14px;min-height:80px;resize:vertical}
input[type=range]{padding:0;border:none;min-height:36px}
input[type=checkbox]{min-height:0;width:20px;height:20px;padding:0;flex:none;accent-color:#4F46E5}
.champ{display:flex;flex-direction:column}
.bouton{height:52px;border-radius:16px;border:none;background:linear-gradient(110deg,#22D3EE,#3B82F6 45%,#8B5CF6);color:#fff;font-family:'Plus Jakarta Sans',Inter,sans-serif;font-size:15px;font-weight:800;box-shadow:0 10px 24px rgba(59,130,246,.35);width:100%;padding:0 16px}
.bouton.second{background:#fff;color:var(--texte);border:1px solid #C9D0E3;box-shadow:none;font-family:Inter,sans-serif;font-weight:700}
.bouton:disabled{opacity:.5}
.deux{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.puces{display:flex;gap:8px;flex-wrap:wrap}
.puce{min-height:44px;padding:0 14px;border-radius:12px;border:1px solid #C9D0E3;background:#fff;color:var(--texte);font-weight:600;font-size:14px}
.puce.on{border:none;background:linear-gradient(135deg,#2563EB,#7C3AED);color:#fff}
.enligne{white-space:nowrap;flex:none;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;min-height:36px;margin-left:auto;margin-right:8px}
.enligne i{width:8px;height:8px;border-radius:50%;background:#34D399;box-shadow:0 0 0 3px rgba(52,211,153,.3)}
.etapes{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
.etapes i{height:6px;border-radius:3px;background:#D5DAE8}
.etapes i.on{background:linear-gradient(90deg,#3B82F6,#8B5CF6)}
.etiquettes{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;font-size:10px;color:var(--gris)}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.kv span:first-child{color:var(--gris)}
.gros{font-family:'Plus Jakarta Sans',Inter,sans-serif;font-size:28px;font-weight:800}
.resultat{border-radius:16px;padding:16px;background:linear-gradient(110deg,#1E3A8A,#5B21B6 60%,#9D174D);color:#fff;display:flex;flex-direction:column;gap:6px}
.resultat .kv span:first-child{color:#DDE3FF}
.lp{display:flex;align-items:center;justify-content:space-between;gap:8px}
.lp input{width:124px;text-align:right;font-weight:700;flex:none}
.lp input.main{border:2px solid #EA580C;background:#FFF7ED}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:44px;height:44px;border-radius:12px;border:1px solid #C9D0E3;background:#fff;font-size:18px;color:var(--texte)}
.stepper b{min-width:48px;text-align:center}
.photo{height:150px;border-radius:16px;border:2px dashed #9AA5C9;background:#fff;color:#3E4A6B;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;overflow:hidden;position:relative}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.photo input{position:absolute;inset:0;opacity:0;min-height:0}
.vide{color:var(--gris);font-size:14px;text-align:center;padding:16px}
.erreur{background:#FFE4E6;color:#9F1239;border-radius:12px;padding:12px;font-size:14px}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#0B1442;color:#fff;padding:12px 18px;border-radius:14px;font-size:14px;z-index:20;max-width:90%;display:none}
#chargement{position:fixed;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#22D3EE,#8B5CF6,#EC4899);display:none;z-index:30}
.section{padding:0 16px;display:flex;flex-direction:column;gap:12px;margin-top:-20px;position:relative}
.connexion{min-height:100vh;background:linear-gradient(170deg,#0B1442,#142266 55%,#22307F);color:#fff;padding:60px 24px;display:flex;flex-direction:column;gap:18px;position:relative;overflow:hidden}
.connexion .carte{color:var(--texte);gap:14px;padding:18px}
/* Tablette et ordinateur : plus large, listes sur deux colonnes, menu sur le côté au-delà de 1100 px */
@media (min-width:700px){
  #app{max-width:880px}
  .tuiles{grid-template-columns:repeat(4,minmax(0,1fr))}
  nav{max-width:560px}
  .feuille,.section{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
  .feuille>*,.section>*{grid-column:1/-1}
  .feuille>.item,.section>.item,.feuille>button.item,.section>button.item{grid-column:auto;height:100%}
  .hero{padding:28px 28px 48px}.entete{padding:18px 28px 38px}.feuille{padding:20px 24px 0}.section{padding:0 24px}
  .hero h1{font-size:26px}.entete h1{font-size:24px}
}
@media (min-width:1100px){
  #app{max-width:min(1040px,calc(100vw - 170px));margin-left:max(150px,calc((100vw - 1040px)/2));padding-bottom:32px}
  nav{left:24px;top:24px;bottom:auto;transform:none;width:104px;height:auto;max-width:none;grid-template-columns:1fr;grid-auto-rows:auto;padding:14px 0;gap:6px}
  nav button{height:64px;font-size:12px}
  nav>span{order:-1;padding-bottom:6px}
  nav .plus{margin:0 auto}
  #toast{bottom:32px}
  .feuille,.section{grid-template-columns:repeat(3,minmax(0,1fr))}
}
</style>
</head>
<body>
<div id="chargement"></div>
<div id="app"></div>
<div id="toast" role="status"></div>
<script>
const ICONES = {
  outil: '<path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-.6-.6-2.4z"/>',
  maison: '<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  liste: '<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>',
  calendrier: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  auto: '<path d="M3 16V11l2-5h14l2 5v5"/><path d="M3 16h18"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/>',
  courbe: '<path d="M4 19V5M4 19h16M8 15l4-4 3 3 5-6"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  gauche: '<path d="M15 6l-6 6 6 6"/>', droite: '<path d="M9 6l6 6-6 6"/>',
  froid: '<path d="M12 2v20M4.9 6.5l14.2 11M19.1 6.5L4.9 17.5"/>',
  eclair: '<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>',
  ampoule: '<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.8.8 1 1.5 1 2.5h6c0-1 .2-1.7 1-2.5A6 6 0 0 0 12 3z"/>',
  mail: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>',
  bouclier: '<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/>',
  photo: '<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',
  boite: '<path d="M3 7l9-4 9 4v10l-9 4-9-4z"/><path d="M3 7l9 4 9-4M12 11v10"/>',
};
function svg(nom, taille, couleur, epaisseur) {
  return '<svg aria-hidden="true" width="' + (taille || 22) + '" height="' + (taille || 22) + '" viewBox="0 0 24 24" fill="none" stroke="' + (couleur || 'currentColor') + '" stroke-width="' + (epaisseur || 2) + '" stroke-linecap="round" stroke-linejoin="round">' + ICONES[nom] + '</svg>';
}
function esc(t) { return String(t == null ? '' : t).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function fcfa(n) { return Math.round(Number(n) || 0).toLocaleString('fr-FR') + ' F'; }
function dateCourte(d) { if (!d) return ''; const x = new Date(d); return x.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit' }); }
function depuis(d) {
  if (!d) return ''; const m = Math.round((Date.now() - new Date(d)) / 60000);
  if (m < 60) return 'il y a ' + Math.max(m, 1) + ' min'; if (m < 1440) return 'il y a ' + Math.round(m / 60) + ' h';
  if (m < 2880) return 'hier'; return 'le ' + dateCourte(d);
}
function $(id) { return document.getElementById(id); }

let JETON = null;
try { JETON = localStorage.getItem('ms_jeton'); } catch (e) {}
let MOI = null;
try { MOI = JSON.parse(localStorage.getItem('ms_moi') || 'null'); } catch (e) {}
const etat = { pile: [] };
// Valeurs enregistrées dans la feuille → libellés affichés.
const TYPES = ['Curatif', 'Préventif', 'Travaux', 'Sécurité'];
const LIBELLES_TYPE = { 'Curatif': 'Maintenance curative (dépannage)', 'Préventif': 'Maintenance préventive', 'Travaux': 'Travaux', 'Sécurité': 'Sécurité' };

function toast(message) {
  const t = $('toast'); t.textContent = message; t.style.display = 'block';
  clearTimeout(toast.minuteur); toast.minuteur = setTimeout(() => { t.style.display = 'none'; }, 3200);
}
function appel(action, args) {
  $('chargement').style.display = 'block';
  return new Promise((ok, ko) => {
    google.script.run
      .withSuccessHandler((r) => { $('chargement').style.display = 'none'; ok(r); })
      .withFailureHandler((e) => {
        $('chargement').style.display = 'none';
        const msg = (e && e.message) || String(e);
        if (msg.indexOf('SESSION_EXPIREE') !== -1) { seDeconnecter(); ko(new Error('Session expirée, reconnecte-toi.')); return; }
        ko(new Error(msg.replace(/^Error: /, '').replace(/^Exception: /, '')));
      })
      .api(JETON, action, args || {});
  });
}
function echec(e) { toast(e.message || String(e)); }

function aLePlanning() { return MOI && (MOI.droits || []).indexOf('Planning') !== -1; }
function aDesReglages() { return MOI && (estChef() || aLePlanning() || ['STOCK', 'VEHICULES'].indexOf(MOI.role) !== -1); }
function estChef() { return MOI && (MOI.role === 'DG' || MOI.role === 'DGA'); }
function voitFinances() { return MOI && ['DG', 'DGA', 'COMPTABILITE'].indexOf(MOI.role) !== -1; }
function initiales(nom) { return String(nom || '?').split(/\s+/).map((m) => m[0]).join('').slice(0, 2).toUpperCase(); }

// Retour du téléphone (geste ou touche) : chaque écran ouvert ajoute une étape à l'historique.
const HISTO = window.google && google.script && google.script.history;
// Signe de vie toutes les 2 minutes tant que l'appli est ouverte et visible (compteur « en ligne »).
setInterval(() => { if (JETON && document.visibilityState === 'visible') try { google.script.run.withFailureHandler(() => {}).api(JETON, 'ping', {}); } catch (e) {} }, 120000);
if (HISTO) HISTO.setChangeHandler(() => { if (etat.pile.length) revenir(); else if (etat.courant && etat.courant.ecran !== 'accueil') aller('accueil', {}, true); });
function aller(ecran, params, sansHistorique) {
  if (!sansHistorique && etat.courant) {
    etat.pile.push(etat.courant);
    if (HISTO) try { HISTO.push({ e: ecran, n: etat.pile.length }); } catch (e) {}
  }
  etat.courant = { ecran, params: params || {} };
  window.scrollTo(0, 0);
  ECRANS[ecran](params || {});
}
function revenir() {
  const precedent = etat.pile.pop();
  if (precedent) { etat.courant = precedent; ECRANS[precedent.ecran](precedent.params); } else aller('accueil', {}, true);
}
function racine(ecran) { etat.pile = []; etat.courant = null; aller(ecran); }

function rendre(html, ongletActif) {
  // Tout écran sans barre du bas, ou ouvert depuis un autre, a son bouton Retour.
  const aRetour = html.indexOf('class="retour"') !== -1;
  const ecranCourant = etat.courant && etat.courant.ecran;
  if (!aRetour && MOI && ecranCourant && ecranCourant !== 'accueil' && html.indexOf('class="connexion"') === -1 && (ongletActif === null || etat.pile.length)) {
    html = html.replace('<div class="orb a"></div>', '<div class="orb a"></div><button class="retour" onclick="revenir()">' + svg('gauche', 18, 'currentColor', 2.2) + 'Retour</button>');
  }
  $('app').innerHTML = html + (ongletActif === null ? '' : navigation(ongletActif));
}
function navigation(actif) {
  const b = (id, ico, nom) => '<button class="' + (actif === id ? 'actif' : '') + '" onclick="racine(\'' + id + '\')">' + svg(ico) + nom + '</button>';
  return '<nav aria-label="Navigation">' + b('accueil', 'maison', 'Accueil') + b('affaires', 'liste', 'Affaires')
    + '<span><button class="plus" aria-label="Nouvelle demande" onclick="aller(\'nouvelle\')">' + svg('plus', 24, '#fff', 2.6) + '</button></span>'
    + b('vehicules', 'auto', 'Véhicules') + (voitFinances() ? b('argent', 'courbe', 'Argent') : b('materiel', 'outil', 'Matériel')) + '</nav>';
}
function entete(titre, sousTitre) {
  return '<div class="entete"><div class="orb a"></div><button class="retour" onclick="revenir()">' + svg('gauche', 18, 'currentColor', 2.2) + 'Retour</button>'
    + '<h1>' + esc(titre) + '</h1>' + (sousTitre ? '<p>' + sousTitre + '</p>' : '') + '</div>';
}
function pastillePriorite(p) {
  const c = { 'Élevée': 'p-elevee', 'Moyenne': 'p-moyenne', 'Faible': 'p-faible' }[p] || 'p-vide';
  return '<span class="pastille ' + c + '">' + esc(p || 'À trier') + '</span>';
}
function iconeType(a) {
  if (a.source === 'Mail' && !a.priorite) return '<span class="ico pale">' + svg('mail', 22, '#4F46E5') + '</span>';
  const t = { 'Curatif': ['rouge', 'eclair'], 'Préventif': ['bleu', 'froid'], 'Travaux': ['jaune', 'ampoule'], 'Sécurité': ['violet', 'bouclier'] }[a.type] || ['bleu', 'outil'];
  return '<span class="ico ' + t[0] + '">' + svg(t[1], 22, '#fff') + '</span>';
}

function preparerSignature() {
  const c = $('rsig'), r = c.getBoundingClientRect(), x = c.getContext('2d');
  c.width = r.width * 2; c.height = r.height * 2; x.scale(2, 2); x.lineWidth = 2.2; x.lineCap = 'round'; x.strokeStyle = '#0B1442';
  etat.signe = false; let trace = false;
  const pos = (e) => { const b = c.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
  c.onpointerdown = (e) => { trace = true; c.setPointerCapture(e.pointerId); const p = pos(e); x.beginPath(); x.moveTo(p[0], p[1]); };
  c.onpointermove = (e) => { if (!trace) return; const p = pos(e); x.lineTo(p[0], p[1]); x.stroke(); etat.signe = true; };
  c.onpointerup = c.onpointercancel = () => { trace = false; };
}
function effacerSignature() { const c = $('rsig'); c.getContext('2d').clearRect(0, 0, c.width, c.height); etat.signe = false; }
function ajouterControle() {

    + '<input class="cobs" placeholder="Observation" aria-label="Observation">';
  $('rctl').appendChild(div);
}
function reduireImage(fichier, max, qualite) {
  return new Promise((ok, ko) => {
    const lecteur = new FileReader(), img = new Image();
    lecteur.onerror = ko; img.onerror = ko;
    lecteur.onload = () => {
      img.onload = () => {
        const r = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas'); c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        ok(c.toDataURL('image/jpeg', qualite));
      };
      img.src = lecteur.result;
    };
    lecteur.readAsDataURL(fichier);
  });
}
function ajouterPhotosRapport(input) {
  const fichiers = Array.from(input.files || []).slice(0, 2 - etat.photosRapport.length);
  if (input.files.length > fichiers.length) toast('2 photos au plus');

    etat.photosRapport = etat.photosRapport.concat(urls); input.value = ''; afficherPhotosRapport();
  }).catch(() => toast('Photo illisible'));

    + (paye ? '' : '<details><summary style="font-weight:600;color:#2563EB;min-height:44px;display:flex;align-items:center">+ Saisir un paiement reçu</summary>'

      + '<button class="bouton" type="submit">Enregistrer le paiement</button></form></details>')

      + '<details' + (lignes.length ? '' : ' open') + '><summary style="font-weight:600;color:#2563EB;min-height:44px;display:flex;align-items:center">+ Ajouter une ligne</summary>'
      + '<form onsubmit="ajouterLigne(event)" style="display:flex;flex-direction:column;gap:10px"><input id="ld" placeholder="Désignation" aria-label="Désignation" required>'
      + '<div class="deux"><input id="lq" type="number" inputmode="decimal" value="1" min="0" step="any" aria-label="Quantité" required><input id="lc" type="number" inputmode="numeric" placeholder="Coût unitaire" aria-label="Coût unitaire" required></div>'
      + '<button class="bouton" type="submit">Ajouter la ligne</button></form></details></div>'
      + '<div class="carte"><b style="font-size:13px;color:#5A6585">MARGE NETTE VISÉE (après impôt et commission)</b>'
      + '<div class="puces">' + [25, 30, 35, 40].map((m) => '<button class="puce ' + (Number(dv.MargeVisee) === m ? 'on' : '') + '" onclick="changerTaux({marge:' + m + '})">' + m + ' %</button>').join('') + '</div>'
      + stepper('Commission (% du marché)', 'commission', dv.TauxCommission) + stepper('Impôt (% du marché)', 'impot', dv.TauxImpot)
      + '<button class="bouton second" onclick="changerTaux({reinitialiser:true})">Recalculer toutes les lignes</button></div>'
      + resultatProforma(dv, lignes)
      + '<div class="deux"><button class="bouton second" onclick="pdfProforma()">PDF client</button><button class="bouton" onclick="envoyerProforma()">Envoyer à ' + esc(a.Client) + '</button></div>'
      + (dv.Statut !== 'Validé' ? '<button class="bouton second" onclick="validerProforma()">Marquer comme validée par le client</button>' : '')
      + '</div>';
    rendre(html, null);
  }).catch(echec);
};
function stepper(nom, cle, valeur) {
  const v = Number(valeur);
  return '<div class="ligne" style="font-size:14px"><span>' + nom + '</span><span class="stepper"><button aria-label="Baisser" onclick="changerTaux({' + cle + ':' + (v - 1) + '})">−</button><b>' + v + ' %</b><button aria-label="Augmenter" onclick="changerTaux({' + cle + ':' + (v + 1) + '})">+</button></span></div>';
}
function resultatProforma(dv, lignes) {
  const cout = lignes.reduce((s, l) => s + Number(l.Quantite) * Number(l.CoutUnitaire), 0);
  const prix = lignes.reduce((s, l) => s + Number(l.Quantite) * Number(l.PrixUnitaire), 0);
  const com = prix * Number(dv.TauxCommission) / 100, imp = prix * Number(dv.TauxImpot) / 100;
  const net = prix - cout - com - imp, marge = prix ? Math.round(net / prix * 1000) / 10 : 0;
  return '<div class="resultat"><b style="font-size:13px;color:#DDE3FF">PRIX À PROPOSER AU CLIENT</b><div class="gros">' + fcfa(prix) + '</div>'
    + '<div class="kv"><span>Coûts</span><span>' + fcfa(cout) + '</span></div><div class="kv"><span>Commission</span><span>' + fcfa(com) + '</span></div><div class="kv"><span>Impôt</span><span>' + fcfa(imp) + '</span></div>'
    + '<div class="kv" style="font-weight:700"><span style="color:#fff">Bénéfice net</span><span>' + fcfa(net) + '</span></div>'
    + '<div class="kv" style="font-weight:700"><span style="color:#fff">Marge nette réelle</span><span>' + marge + ' % (visée ' + Number(dv.MargeVisee) + ' %)</span></div></div>';
}
function devisCourant() { return etat.affaire.devis.NumeroDevis; }
function rafraichirProforma() { ECRANS.proforma({ numero: numeroCourant() }); }

function ajouterLigne(ev) {
  ev.preventDefault();
  appel('ajouterLigneDevis', { devis: devisCourant(), designation: $('ld').value, quantite: $('lq').value, cout: $('lc').value }).then(() => rafraichirProforma()).catch(echec);
}
function modifierPrix(ligne, valeur) {
  const prix = parseInt(String(valeur).replace(/\D/g, ''), 10);
  if (isNaN(prix)) return;
  appel('modifierPrixLigne', { devis: devisCourant(), ligne, prix }).then(() => rafraichirProforma()).catch(echec);
}
function changerTaux(t) { appel('changerTauxDevis', Object.assign({ devis: devisCourant() }, t)).then(() => rafraichirProforma()).catch(echec); }
function pdfProforma() { appel('pdfProforma', { devis: devisCourant() }).then((r) => { window.open(r.url, '_blank'); }).catch(echec); }
function envoyerProforma() {
  if (!confirm('Envoyer la proforma par mail au client ?')) return;
  appel('envoyerProforma', { devis: devisCourant() }).then((a) => toast('Proforma envoyée à ' + a)).catch(echec);
}
function validerProforma() { appel('validerDevis', { devis: devisCourant() }).then(() => { toast('Proforma validée'); rafraichirProforma(); }).catch(echec); }

// ---------- Véhicules ----------
ECRANS.vehicules = function () {
  appel('ecranVehicules').then((liste) => {
    rendre('<div class="hero court"><div class="orb a"></div><h1>Véhicules</h1><p style="margin:4px 0 0;color:#C7D2FE;font-size:13px">Je prends / je dépose, avec photo du compteur</p></div><div class="feuille">'
      + (liste.length ? liste.map((v) => '<button class="item" onclick="aller(\'vehicule\',{immatriculation:\'' + esc(v.immatriculation) + '\'})"><span class="ico ' + (v.sorti ? 'jaune' : 'vert') + '">' + svg('auto', 22, '#fff') + '</span>'
        + '<span class="txt"><b>' + esc([v.marque, v.modele].filter(Boolean).join(' ') || v.immatriculation) + '</b><small>' + esc(v.immatriculation) + (v.dernierKm != null ? ' · ' + v.dernierKm.toLocaleString('fr-FR') + ' km' : '') + '</small></span>'
        + '<span class="pastille ' + ((v.alertes || []).length ? 'p-alerte' : v.sorti ? 'p-moyenne' : 'p-ok') + '"' + ((v.alertes || []).length ? ' style="max-width:140px;white-space:normal;text-align:center"' : '') + '>' + ((v.alertes || []).length ? esc(v.alertes[0].texte) : v.sorti ? 'Pris par ' + esc(v.conducteur) : 'Disponible') + '</span></button>').join('')
        : '<div class="vide">Aucun véhicule enregistré. Ajoute-les dans la feuille Vehicules.</div>') + '</div>', 'vehicules');
    etat.vehicules = liste;
  }).catch(echec);
};
ECRANS.vehicule = function (p) {
  const v = (etat.vehicules || []).filter((x) => x.immatriculation === p.immatriculation)[0] || { immatriculation: p.immatriculation };
  etat.photo = null;
  const depot = !!v.sorti;
  rendre(entete(depot ? 'Je dépose' : 'Je prends', esc([v.marque, v.modele].filter(Boolean).join(' ')) + ' · ' + esc(v.immatriculation))
    + '<form class="section" onsubmit="mouvementVehicule(event,' + depot + ')"><div class="carte" style="gap:14px">'
    + '<div class="photo" id="zphoto">' + svg('photo', 34, 'currentColor', 1.8) + '<b>Photo du compteur</b><small>obligatoire</small><input type="file" accept="image/*" capture="environment" aria-label="Photo du compteur" onchange="lirePhoto(this)"></div>'
    + '<div class="champ"><label for="km">Kilométrage au compteur</label><input id="km" type="number" inputmode="numeric" required placeholder="' + (v.dernierKm != null ? 'Dernier relevé : ' + v.dernierKm : '') + '"></div>'
    + (depot ? '<div class="champ"><label for="vi">Ville parcourue</label><input id="vi" placeholder="Ex. Sikensi"></div>' : '')
    + (depot && v.dernierKm != null ? '<div class="kv"><span>Pris à</span><span>' + v.dernierKm.toLocaleString('fr-FR') + ' km par ' + esc(v.conducteur) + '</span></div>' : '')
    + '<button class="bouton" type="submit">' + (depot ? 'Valider le dépôt' : 'Valider la prise') + '</button>'
    + '<small style="color:#5A6585;text-align:center">Une anomalie de kilométrage alerte le référent véhicules.</small></div></form>'
    + (v.documents && Object.keys(v.documents).length ? '<div class="section" style="margin-top:12px"><div class="carte" style="gap:8px"><b style="font-size:13px;color:#5A6585">DOCUMENTS DU VÉHICULE</b>' + boutonsDocuments(v.documents) + '</div></div>' : '')
    + carteEcheances(v), 'vehicules');
};
function carteEcheances(v) {
  const alertes = (v.alertes || []).map((a) => '<div class="kv"><span style="color:' + (a.niveau === 'retard' ? '#B91C1C' : '#B45309') + ';font-weight:600">' + esc(a.texte) + '</span></div>').join('');
  const gere = MOI && ['VEHICULES', 'DG', 'DGA'].indexOf(MOI.role) !== -1;
  if (!gere) return alertes ? '<div class="section" style="margin-top:12px"><div class="carte">' + alertes + '</div></div>' : '';
  return '<div class="section" style="margin-top:12px;padding-bottom:110px"><form class="carte" onsubmit="enregistrerEcheancesUI(event)"><b style="font-size:13px;color:#5A6585">ÉCHÉANCES</b>' + alertes
    + '<div class="deux"><div class="champ"><label for="evt">Visite technique</label><input id="evt" type="date" value="' + esc(v.visiteTechnique || '') + '"></div>'
    + '<div class="champ"><label for="eas">Assurance</label><input id="eas" type="date" value="' + esc(v.assurance || '') + '"></div></div>'
    + '<div class="champ"><label for="evd">Prochaine vidange (km)</label><input id="evd" type="number" inputmode="numeric" value="' + (v.kmProchaineVidange || '') + '"></div>'
    + '<button class="bouton second" type="submit">Enregistrer les échéances</button>'
    + '<small style="color:#5A6585">Arnaud est prévenu 15 jours avant, et 500 km avant la vidange.</small></form></div>';
}
function enregistrerEcheancesUI(ev) {
  ev.preventDefault();
  appel('enregistrerEcheances', { immatriculation: etat.courant.params.immatriculation, echeances: { visiteTechnique: $('evt').value, assurance: $('eas').value, kmProchaineVidange: $('evd').value } })
    .then(() => { toast('Échéances enregistrées'); racine('vehicules'); }).catch(echec);
}
function lirePhoto(input) {
  const f = input.files && input.files[0]; if (!f) return;
  const img = new Image(), lecteur = new FileReader();
  lecteur.onload = () => {
    img.onload = () => {
      const max = 1280, r = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      const url = c.toDataURL('image/jpeg', 0.8); etat.photo = url.split(',')[1];
      const z = $('zphoto'); const apercu = document.createElement('img'); apercu.src = url; apercu.alt = 'Photo du compteur'; z.appendChild(apercu);
    };
    img.src = lecteur.result;
  };
  lecteur.readAsDataURL(f);
}
function mouvementVehicule(ev, depot) {
  ev.preventDefault();
  if (!etat.photo) { toast('Prends la photo du compteur'); return; }
  const imm = etat.courant.params.immatriculation;
  const args = { immatriculation: imm, kilometrage: $('km').value, photo: etat.photo, ville: depot ? $('vi').value : '' };
  appel(depot ? 'deposerVehicule' : 'prendreVehicule', args).then((km) => {
    toast(depot ? (km != null ? km + ' km parcourus, dépôt enregistré' : 'Dépôt enregistré') : 'Prise enregistrée');
    racine('vehicules');
  }).catch(echec);
}

// ---------- Matériel ----------
ECRANS.materiel = function () {
  appel('ecranMateriel').then((d) => {
    etat.materiel = d;
    const outilsDispo = d.outils.filter((o) => o.statut !== 'Sorti'), outilsSortis = d.outils.filter((o) => o.statut === 'Sorti');
    rendre('<div class="hero court"><div class="orb a"></div><h1>Matériel et outils</h1><p style="margin:4px 0 0;color:#C7D2FE;font-size:13px">' + d.nonRendus.length + ' outil(s) non rendu(s)</p></div><div class="feuille">'
      + '<form class="carte" onsubmit="mouvementOutil(event)"><b>Outils : je prends / je rends</b><small style="color:#5A6585">Coche autant d\'outils que tu veux.</small>'
      + (outilsDispo.length ? '<b style="font-size:13px;margin-top:6px">Disponibles (je prends)</b>' + outilsDispo.map((o) => cocheOutil(o, 'oprendre')).join('') : '')
      + (outilsSortis.length ? '<b style="font-size:13px;margin-top:6px">Sortis (je rends)</b>' + outilsSortis.map((o) => cocheOutil(o, 'orendre')).join('') : '')
      + (d.outils.length ? '' : '<div class="vide">Aucun outil enregistré.</div>')
      + '<input id="ml" placeholder="Où ? (site, agence, bureau)" aria-label="Lieu"><button class="bouton" type="submit">Valider</button></form>'
      + '<form class="carte" onsubmit="sortieMateriel(event)"><b>Matériel : je sors pour une affaire</b>'
      + '<input id="ma" placeholder="N° affaire (AFF-…)" aria-label="Numéro d\'affaire" required>'
      + '<div id="lignesMat"></div><button class="bouton second" type="button" onclick="ajouterLigneMat()">+ Ajouter un matériel</button>'
      + '<button class="bouton" type="submit">Sortir du stock</button></form>'
      + (d.sortiesEnCours.length ? '<h2>Sorties à clôturer</h2>' + d.sortiesEnCours.map((m, i) => '<form class="carte" onsubmit="retourMateriel(event,' + i + ')"><b>' + esc(m.Materiel) + ' · ' + esc(m.NumeroAffaire) + '</b><small style="color:#5A6585">Sorti ' + esc(m.QuantiteSortie) + ' par ' + esc(m.Agent) + '</small>'
        + '<div class="deux"><input id="rp' + i + '" type="number" inputmode="decimal" step="any" placeholder="Posé" aria-label="Quantité posée" required><input id="rr' + i + '" type="number" inputmode="decimal" step="any" placeholder="Rapporté" aria-label="Quantité rapportée" required></div><button class="bouton second" type="submit">Déclarer</button></form>').join('') : '')
      + '<h2>Outils non rendus · ' + d.nonRendus.length + '</h2>'
      + (d.nonRendus.length ? d.nonRendus.map((o) => '<div class="carte"><div class="ligne"><b>' + esc(o.outil) + '</b><span class="pastille ' + (o.joursDeRetard >= 2 ? 'p-alerte' : 'p-moyenne') + '">' + o.joursDeRetard + ' jour' + (o.joursDeRetard > 1 ? 's' : '') + '</span></div><small style="color:#5A6585">Pris par <b style="color:#0F1733">' + esc(o.prisPar) + '</b> le ' + dateCourte(o.depuis) + ' · ' + esc(o.lieuDeclare) + '</small></div>').join('') : '<div class="vide">Tout est rendu.</div>')
      + (d.ecarts.length ? '<h2>Écarts matériel · ' + d.ecarts.length + '</h2>' + d.ecarts.map((m) => '<div class="carte"><b>' + esc(m.Materiel) + ' : ' + (Number(m.QuantiteSortie) - Number(m.QuantitePosee) - Number(m.QuantiteRapportee)) + ' manquant(s)</b><small style="color:#5A6585">Sorti ' + esc(m.QuantiteSortie) + ' · posé ' + esc(m.QuantitePosee) + ' · rapporté ' + esc(m.QuantiteRapportee) + ' · ' + esc(m.NumeroAffaire) + ' · ' + esc(m.Agent) + '</small></div>').join('') : '')
      + '</div>', voitFinances() ? null : 'materiel');
    ajouterLigneMat();
  }).catch(echec);
};
function cocheOutil(o, cls) { return '<label style="display:flex;gap:10px;align-items:center;min-height:40px"><input type="checkbox" class="' + cls + '" value="' + esc(o.outil) + '" style="width:20px;height:20px"> ' + esc(o.outil) + (o.lieu ? ' <small style="color:#5A6585">· ' + esc(o.lieu) + '</small>' : '') + (o.photo ? ' <a href="#" aria-label="Voir la photo" onclick="event.preventDefault();event.stopPropagation();voirImage(\'' + esc(o.photo) + '\',\'' + esc(o.outil).replace(/'/g, '&#39;') + '\')">' + svg('photo', 16, '#2563EB', 2) + '</a>' : '') + '</label>'; }
function ajouterLigneMat() {
  const d = etat.materiel, div = document.createElement('div');
  div.className = 'deux ligneMat';
  div.innerHTML = '<select aria-label="Matériel"><option value="">Choisir le matériel…</option>' + d.materiel.map((m) => '<option value="' + esc(m.materiel) + '">' + esc(m.materiel) + ' (stock ' + esc(m.quantite) + ')</option>').join('') + '</select>'
    + '<input type="number" inputmode="decimal" step="any" placeholder="Quantité" aria-label="Quantité">';
  $('lignesMat').appendChild(div);
}
function mouvementOutil(ev) {
  ev.preventDefault();
  const coches = (cls) => Array.from(document.querySelectorAll('.' + cls + ':checked')).map((x) => x.value);
  const prendre = coches('oprendre'), rendre = coches('orendre');
  if (!prendre.length && !rendre.length) { toast('Coche au moins un outil'); return; }
  appel('mouvementsOutils', { prendre, rendre, lieu: $('ml').value }).then((b) => {
    toast([b.pris.length ? b.pris.length + ' pris' : '', b.rendus.length ? b.rendus.length + ' rendu(s)' : ''].filter(Boolean).join(', ') + (b.erreurs.length ? ' · ' + b.erreurs.join(' ; ') : ''));
    ECRANS.materiel();
  }).catch(echec);
}
function sortieMateriel(ev) {
  ev.preventDefault();
  const lignes = Array.from(document.querySelectorAll('.ligneMat')).map((l) => ({ materiel: l.querySelector('select').value, quantite: l.querySelector('input').value })).filter((l) => l.materiel);
  if (!lignes.length) { toast('Choisis au moins un matériel'); return; }
  appel('sortirMateriels', { numero: $('ma').value.trim(), lignes }).then((n) => { toast(n + ' sortie(s) enregistrée(s)'); ECRANS.materiel(); }).catch(echec);
}
function retourMateriel(ev, i) {
  ev.preventDefault();
  const m = etat.materiel.sortiesEnCours[i];
  appel('declarerRetourMateriel', { materiel: m.Materiel, numero: m.NumeroAffaire, posee: $('rp' + i).value, rapportee: $('rr' + i).value }).then(() => { toast('Retour déclaré'); ECRANS.materiel(); }).catch(echec);
}

// ---------- Argent ----------
function periode(nom) {
  const a = new Date(), debut = new Date(a);
  if (nom === 'mois') debut.setDate(1);
  else if (nom === 'trimestre') { debut.setMonth(Math.floor(a.getMonth() / 3) * 3); debut.setDate(1); }
  else { debut.setMonth(0); debut.setDate(1); }
  return { debut: debut.toISOString().slice(0, 10), fin: a.toISOString().slice(0, 10) };
}
ECRANS.argent = function (p) {
  const nom = p.periode || 'trimestre', per = periode(nom);
  appel('ecranArgent', per).then((d) => {
    const t = d.total;
    rendre('<div class="hero court"><div class="orb a"></div><div class="orb b"></div><h1>Argent</h1><div class="puces" style="margin-top:12px">'
      + [['mois', 'Ce mois'], ['trimestre', 'Trimestre'], ['annee', 'Année']].map((x) => '<button class="puce ' + (x[0] === nom ? 'on' : '') + '" onclick="aller(\'argent\',{periode:\'' + x[0] + '\'},true)">' + x[1] + '</button>').join('') + '</div></div>'
      + '<div class="feuille"><div class="resultat"><b style="font-size:13px;color:#DDE3FF">BÉNÉFICE NET DE L\'ENTREPRISE</b><div class="gros">' + fcfa(t.beneficeNetEntreprise) + '</div>'
      + '<div class="kv"><span>Facturé</span><span>' + fcfa(t.facture) + '</span></div><div class="kv"><span>Encaissé</span><span>' + fcfa(t.encaisse) + '</span></div><div class="kv"><span>Dépenses</span><span>' + fcfa(t.depenses) + '</span></div></div>'
      + '<h2>À encaisser</h2>'
      + (d.aEncaisser.length ? d.aEncaisser.map((f) => '<button class="item" onclick="aller(\'affaire\',{numero:\'' + esc(f.affaire) + '\'})"><span class="ico ' + (f.joursDeRetard > 0 ? 'rouge' : 'bleu') + '">' + svg('liste', 22, '#fff') + '</span><span class="txt"><b>' + esc(f.client) + ' · ' + fcfa(f.reste) + '</b><small>' + esc(f.document || f.numero) + ' · ' + esc(f.titre) + '</small></span>'
        + '<span class="pastille ' + (f.joursDeRetard > 0 ? 'p-alerte' : 'p-moyenne') + '">' + (f.joursDeRetard > 0 ? f.joursDeRetard + ' j retard' : (f.echeance ? 'le ' + dateCourte(f.echeance) : '')) + '</span></button>').join('') : '<div class="vide">Aucune facture en attente.</div>')
      + '<h2>Par client</h2>'
      + (d.parClient.length ? d.parClient.map((b) => '<div class="item"><span class="ico ' + ((b.margeNettePourcent || 0) < 25 ? 'rouge' : 'vert') + '">' + svg('courbe', 22, '#fff') + '</span><span class="txt"><b>' + esc(b.client) + '</b><small>' + b.affaires.length + ' affaire(s) · dépenses ' + fcfa(b.totalDepenses) + '</small></span>'
        + '<span class="pastille ' + ((b.margeNettePourcent || 0) < 25 ? 'p-alerte' : 'p-ok') + '">' + (b.margeNettePourcent != null ? b.margeNettePourcent + ' %' : '–') + '</span></div>').join('') : '<div class="vide">Aucune affaire sur la période.</div>')
      + '<div class="item"><span class="ico jaune">' + svg('boite', 22, '#fff') + '</span><span class="txt"><b>Frais généraux (hors marché)</b><small>loyer, carburant bureau, divers</small></span><b>' + fcfa(d.depenses.parAffaire['Hors marché'] || 0) + '</b></div>'
      + '</div>', 'argent');
  }).catch(echec);
};

// ---------- Point de situation ----------
ECRANS.point = function (p) {
  appel('listeClients').then((clients) => {
    const client = p.client || (clients[0] && clients[0].nom);
    if (!client) { rendre(entete('Point de situation') + '<div class="section"><div class="vide">Aucun client pour l\'instant.</div></div>', null); return; }
    appel('pointDeSituation', { client }).then((pt) => {
      etat.point = client;
      const lieu = (a) => esc(a.titre) + (a.site ? ' <span style="color:#5A6585">(' + esc(a.site) + ')</span>' : '');
      const bloc = (titre, elements, rendu, alerte) => '<div class="carte"' + (alerte && elements.length ? ' style="border:1px solid #FECDD3"' : '') + '><div class="ligne"><b>' + titre + '</b><b>' + elements.length + '</b></div>'
        + (elements.length ? elements.map((a) => '<div class="kv"><span style="color:#0F1733">' + lieu(a) + '</span><span style="white-space:nowrap;font-weight:600">' + rendu(a) + '</span></div>').join('') : '<small style="color:#5A6585">Aucun.</small>') + '</div>';
      rendre(entete('Point de situation', 'Généré depuis les affaires · au ' + new Date().toLocaleDateString('fr-FR'))
        + '<div class="section"><div class="puces">' + clients.map((c) => '<button class="puce ' + (c.nom === client ? 'on' : '') + '" onclick="aller(\'point\',{client:\'' + esc(c.nom).replace(/&#39;/g, "\\'") + '\'},true)">' + esc(c.nom) + '</button>').join('') + '</div>'
        + bloc('1. Problèmes signalés', pt.problemesSignales, (a) => esc(a.statut))
        + bloc('2. Actions réalisées et avancement', pt.actionsRealisees, (a) => a.avancement + ' %')
        + bloc('3. Difficultés en attente', pt.difficultes, (a) => esc(a.blocage), true)
        + bloc('4. Actions restantes et délais', pt.actionsRestantes, (a) => esc(a.prochaineAction || 'à finaliser') + ' · ' + (a.delaiPrevu ? dateCourte(a.delaiPrevu) : 'à définir'))
        + '<div class="deux"><button class="bouton second" onclick="pdfPoint()">PDF</button>' + (estChef() ? '<button class="bouton" onclick="envoyerPoint()">Répondre par mail</button>' : '') + '</div></div>', null);
    }).catch(echec);
  }).catch(echec);
};
function pdfPoint() { appel('pdfPointDeSituation', { client: etat.point }).then((url) => window.open(url, '_blank')).catch(echec); }
function envoyerPoint() {
  if (!confirm('Envoyer le point de situation par mail à ' + etat.point + ' ?')) return;
  appel('envoyerPointDeSituation', { client: etat.point }).then((a) => toast('Envoyé à ' + a)).catch(echec);
}

// ---------- Compte ----------
ECRANS.compte = function () {
  rendre(entete(MOI.nom, esc(MOI.email) + ' · ' + esc(MOI.role))
    + '<div class="section"><form class="carte" onsubmit="changerCode(event)"><b>Changer mon code</b><input id="nouveau" type="password" inputmode="numeric" pattern="[0-9]{4,6}" placeholder="4 à 6 chiffres" aria-label="Nouveau code" required><button class="bouton second" type="submit">Enregistrer</button></form>'
    + (aDesReglages() ? '<button class="bouton" onclick="aller(\'reglages\')">Réglages</button>' : '')
    + '<button class="bouton second" onclick="seDeconnecter()">Se déconnecter</button></div>', null);
};
function changerCode(ev) { ev.preventDefault(); appel('changerMonCode', { code: $('nouveau').value }).then(() => { toast('Code changé'); revenir(); }).catch(echec); }

if (JETON) racine('accueil'); else ecranConnexion();
